<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İzmit-Tepetarla Akıllı Servis (Korumalı)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .panel { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 10px; cursor: pointer; } /* Başlığa tıklama özelliği verdik */
        
        .live-tracker { background: #1a73e8; color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: center; border: 2px solid #fff; }
        
        .durak-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .durak-btn { padding: 15px 5px; border: 2px solid #ddd; border-radius: 15px; background: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .secili { background: #2ecc71 !important; color: white; border-color: #27ae60; }
        
        /* Şoför Paneli Başlangıçta Gizli */
        .driver-zone { display: none; margin-top: 30px; background: #2c3e50; color: white; padding: 20px; border-radius: 20px; text-align: center; border: 3px solid #f4b400; }
        .play-btn { background: #f4b400; color: #000; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
        #gpsBilgi { font-size: 11px; margin-top: 10px; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="panel">
    <h2 onclick="kaptanKilidiniAc()">🚌 Servis Takip</h2>
    
    <div class="live-tracker">
        <div style="font-size: 11px; opacity: 0.8;">GÜNCEL KONUM:</div>
        <div id="aracKonumuText" style="font-size: 18px; font-weight: bold; margin-top: 5px;">Yükleniyor...</div>
    </div>

    <div class="durak-grid" id="durakContainer"></div>

    <div id="kaptanPanel" class="driver-zone">
        <h3 style="margin-top:0">👨‍✈️ Kaptan Özel Paneli</h3>
        <button id="startBtn" class="play-btn" onclick="gpsTakibiBaslat()">YOLA ÇIK / GPS AÇ 📡</button>
        <div id="gpsBilgi">GPS Beklemede.</div>
        <button style="background:#e74c3c; color:white; border:none; padding:10px; margin-top:15px; border-radius:8px; width:100%; cursor:pointer;" onclick="listeyiSifirla()">VARDİYA TEMİZLE</button>
    </div>
    
    <p style="text-align:center; font-size:10px; color:#aaa; margin-top:20px;">Mustafa Özden © 2026</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCgQJ_r0c5yL_vvYscFS7SXv-JaofqjG2Y",
        authDomain: "personel-servis-a1afa.firebaseapp.com",
        projectId: "personel-servis-a1afa",
        storageBucket: "personel-servis-a1afa.firebasestorage.app",
        messagingSenderId: "316822744111",
        appId: "1:316822744111:web:c4efe6a7c86cb06ffe6ada",
        databaseURL: "https://personel-servis-a1afa-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ŞİFRE MEKANİZMASI
    let tiklamaSayisi = 0;
    function kaptanKilidiniAc() {
        tiklamaSayisi++;
        if (tiklamaSayisi === 3) {
            let sifre = prompt("Kaptan Şifresini Girin:");
            if (sifre === "4141") { // Şifreni buradan değiştirebilirsin
                document.getElementById('kaptanPanel').style.display = 'block';
                alert("Hoş geldin Kaptan! Panel açıldı.");
            } else {
                alert("Hatalı Şifre!");
                tiklamaSayisi = 0;
            }
        }
    }

    const durakVerileri = [
        { ad: "Orduevi", lat: 40.7630, lon: 29.9140 },
        { ad: "Halkevi", lat: 40.7621, lon: 29.9288 },
        { ad: "Yenicuma", lat: 40.7635, lon: 29.9375 },
        { ad: "Emniyet", lat: 40.7645, lon: 29.9450 },
        { ad: "Real", lat: 40.7655, lon: 29.9550 },
        { ad: "Kandıra Sapağı", lat: 40.7660, lon: 29.9680 },
        { ad: "Kavakçılık", lat: 40.7670, lon: 29.9800 },
        { ad: "Akademi", lat: 40.7680, lon: 29.9920 },
        { ad: "Sembol", lat: 40.7690, lon: 30.0050 },
        { ad: "Goodyear Sapağı", lat: 40.7705, lon: 30.0150 },
        { ad: "Ustaeller", lat: 40.7720, lon: 30.0300 },
        { ad: "Gazoz", lat: 40.7730, lon: 30.0350 },
        { ad: "Tesis", lat: 40.7750, lon: 30.0500 }
    ];

    let kullaniciAdi = localStorage.getItem('servisKullaniciAdi') || prompt("Adınız Soyadınız:");
    localStorage.setItem('servisKullaniciAdi', kullaniciAdi);

    let bulutVerisi = {};
    const container = document.getElementById('durakContainer');

    durakVerileri.forEach((d, i) => {
        let btn = document.createElement('button');
        btn.className = 'durak-btn';
        btn.id = "btn-" + i;
        btn.innerHTML = `<strong>${d.ad}</strong><div id="isimler-${i}" style="font-size:10px; color:#555"></div>`;
        btn.onclick = () => {
            if (bulutVerisi[d.ad] && bulutVerisi[d.ad][kullaniciAdi]) db.ref('aktifDuraklar/'+d.ad+'/'+kullaniciAdi).remove();
            else db.ref('aktifDuraklar/'+d.ad+'/'+kullaniciAdi).set(true);
        };
        container.appendChild(btn);
    });

    db.ref().on('value', snap => {
        const data = snap.val() || {};
        bulutVerisi = data.aktifDuraklar || {};
        durakVerileri.forEach((d, i) => {
            const btn = document.getElementById("btn-"+i);
            const isimDiv = document.getElementById("isimler-"+i);
            if (bulutVerisi[d.ad]) {
                btn.classList.add('secili');
                isimDiv.innerText = Object.keys(bulutVerisi[d.ad]).join(", ");
            } else {
                btn.classList.remove('secili');
                isimDiv.innerText = "";
            }
        });
        document.getElementById('aracKonumuText').innerText = data.aracKonumu ? data.aracKonumu.nerede : "Henüz yola çıkılmadı.";
    });

    function konus(metin) {
        const msg = new SpeechSynthesisUtterance(metin);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
    }

    let anonsYapilanlar = new Set();
    function gpsTakibiBaslat() {
        if (!navigator.geolocation) return alert("GPS Yok!");
        document.getElementById('startBtn').innerText = "TAKİP AÇIK ✅";
        document.getElementById('startBtn').style.background = "#2ecc71";
        navigator.geolocation.watchPosition(pos => {
            const myLat = pos.coords.latitude;
            const myLon = pos.coords.longitude;
            let enYakinDurak = "Yolda...";
            let minMesafe = 999;
            durakVerileri.forEach(durak => {
                const m = calculateDistance(myLat, myLon, durak.lat, durak.lon);
                if (m < minMesafe) { minMesafe = m; enYakinDurak = durak.ad + " yakınlarında"; }
                if (m < 0.25 && !anonsYapilanlar.has(durak.ad)) {
                    if (bulutVerisi[durak.ad]) {
                        konus(`${durak.ad} durağına yaklaştınız. Personel bekliyor.`);
                    }
                    anonsYapilanlar.add(durak.ad);
                }
            });
            db.ref('aracKonumu').set({ nerede: enYakinDurak });
        }, null, { enableHighAccuracy: true });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function listeyiSifirla() {
        if(confirm("Listeyi temizle?")) { db.ref().remove(); location.reload(); }
    }
</script>
</body>
</html>
