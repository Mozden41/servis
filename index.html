<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İzmit-Tepetarla Servis V3.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #2ecc71; --dark: #2c3e50; }
        body { font-family: sans-serif; background: #eef2f7; margin: 0; padding: 10px; }
        .panel { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .live-tracker { background: #1a73e8; color: white; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .durak-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .durak-btn { padding: 15px 5px; border: 2px solid #eee; border-radius: 15px; background: white; display: flex; flex-direction: column; align-items: center; font-size: 13px; }
        .secili { background: #2ecc71 !important; color: white; }
        .driver-zone { display: none; margin-top: 25px; background: #2c3e50; color: white; padding: 20px; border-radius: 20px; }
        .btn-main { background: #f4b400; color: black; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .test-btn { background: #9b59b6; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="panel">
    <h2 onclick="kaptanKilidiniAc()" style="text-align:center; color:#1a73e8;">🚌 Servis Takip V3</h2>
    
    <div class="live-tracker">
        <div style="font-size:11px;">ARAÇ KONUMU:</div>
        <div id="aracKonumuText" style="font-size:18px; font-weight:bold;">Yükleniyor...</div>
    </div>

    <div class="durak-grid" id="durakContainer"></div>

    <div id="kaptanPanel" class="driver-zone">
        <h3 style="text-align:center; color:#f4b400;">👨‍✈️ Şoför Paneli</h3>
        
        <button class="test-btn" onclick="konus('Ses kontrol. Sistem şu an konuşmaya hazır.')">🔊 SES TESTİ YAP (Önce Bas!)</button>
        
        <button id="startBtn" class="btn-main" onclick="gpsTakibiBaslat()">🛰️ GPS TAKİBİ BAŞLAT</button>
        
        <div id="gpsBilgi" style="font-size:11px; text-align:center; color:#ccc;">GPS Beklemede.</div>
        <button style="background:#e74c3c; color:white; border:none; padding:10px; margin-top:15px; border-radius:8px; width:100%;" onclick="listeyiSifirla()">🧹 LİSTEYİ SIFIRLA</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCgQJ_r0c5yL_vvYscFS7SXv-JaofqjG2Y",
        authDomain: "personel-servis-a1afa.firebaseapp.com",
        projectId: "personel-servis-a1afa",
        storageBucket: "personel-servis-a1afa.firebasestorage.app",
        messagingSenderId: "316822744111",
        appId: "1:316822744111:web:c4efe6a7c86cb06ffe6ada",
        databaseURL: "https://personel-servis-a1afa-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let tik = 0;
    function kaptanKilidiniAc() { tik++; if (tik === 3) { if (prompt("Şifre:") === "4141") document.getElementById('kaptanPanel').style.display='block'; else tik=0; } }

    const duraklar = [
        { ad: "Orduevi", lat: 40.7630, lon: 29.9140 }, { ad: "Halkevi", lat: 40.7621, lon: 29.9288 },
        { ad: "Yenicuma", lat: 40.7635, lon: 29.9375 }, { ad: "Emniyet", lat: 40.7645, lon: 29.9450 },
        { ad: "Real", lat: 40.7655, lon: 29.9550 }, { ad: "Kandıra Sapağı", lat: 40.7660, lon: 29.9680 },
        { ad: "Kavakçılık", lat: 40.7670, lon: 29.9800 }, { ad: "Akademi", lat: 40.7680, lon: 29.9920 },
        { ad: "Sembol", lat: 40.7690, lon: 30.0050 }, { ad: "Goodyear", lat: 40.7705, lon: 30.0150 },
        { ad: "Askeriye", lat: 40.7712, lon: 30.0220 }, { ad: "Ustaeller", lat: 40.7720, lon: 30.0300 },
        { ad: "Gazoz", lat: 40.7730, lon: 30.0350 }, { ad: "Diş Hast.", lat: 40.7740, lon: 30.0400 },
        { ad: "Likarba", lat: 40.7745, lon: 30.0450 }, { ad: "Sarımeşe", lat: 40.7748, lon: 30.0480 },
        { ad: "Tesis", lat: 40.7750, lon: 30.0500 }
    ];

    let kullaniciAdi = localStorage.getItem('servisKullaniciAdi') || prompt("Ad Soyad:");
    localStorage.setItem('servisKullaniciAdi', kullaniciAdi);

    let bulutVerisi = {};
    const container = document.getElementById('durakContainer');
    duraklar.forEach((d, i) => {
        let btn = document.createElement('button');
        btn.className = 'durak-btn'; btn.id = "btn-" + i;
        btn.innerHTML = `<strong>${i+1}. ${d.ad}</strong><div id="isimler-${i}" style="font-size:10px; color:#666; margin-top:5px;"></div>`;
        btn.onclick = () => {
            if (bulutVerisi[d.ad] && bulutVerisi[d.ad][kullaniciAdi]) db.ref('aktifDuraklar/'+d.ad+'/'+kullaniciAdi).remove();
            else db.ref('aktifDuraklar/'+d.ad+'/'+kullaniciAdi).set(true);
        };
        container.appendChild(btn);
    });

    db.ref().on('value', snap => {
        const data = snap.val() || {}; bulutVerisi = data.aktifDuraklar || {};
        duraklar.forEach((d, i) => {
            const btn = document.getElementById("btn-"+i); const isimDiv = document.getElementById("isimler-"+i);
            if (bulutVerisi[d.ad]) { btn.classList.add('secili'); isimDiv.innerText = Object.keys(bulutVerisi[d.ad]).join(", "); }
            else { btn.classList.remove('secili'); isimDiv.innerText = ""; }
        });
        document.getElementById('aracKonumuText').innerText = data.aracKonumu ? data.aracKonumu.nerede : "Bekleniyor";
    });

    // DAHA GÜÇLÜ SES FONKSİYONU
    function konus(metin) {
        window.speechSynthesis.cancel(); // Önceki konuşmayı kes
        const msg = new SpeechSynthesisUtterance(metin);
        msg.lang = 'tr-TR';
        msg.volume = 1; // Maksimum ses
        msg.rate = 0.9; // Biraz yavaş ve anlaşılır
        window.speechSynthesis.speak(msg);
    }

    let anonsYapilanlar = new Set();
    function gpsTakibiBaslat() {
        if (!navigator.geolocation) return alert("GPS Yok!");
        document.getElementById('startBtn').innerText = "TAKİP AKTİF ✅";
        konus("GPS takibi ve sesli bildirimler başlatıldı.");

        navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude; const lon = pos.coords.longitude;
            let yakinDurak = "Yolda..."; let yakinlik = 999;

            duraklar.forEach(durak => {
                const mesafe = calculateDistance(lat, lon, durak.lat, durak.lon);
                if (mesafe < yakinlik) { yakinlik = mesafe; yakinDurak = durak.ad + " yakınlarında"; }
                
                // UYARI MESAFESİ: 0.50 (500 Metreye çıkarıldı)
                if (mesafe < 0.50 && !anonsYapilanlar.has(durak.ad)) {
                    if (bulutVerisi[durak.ad]) {
                        const isimler = Object.keys(bulutVerisi[durak.ad]);
                        konus(`${durak.ad} durağına yaklaştınız. Bekleyen personel: ${isimler.join(", ")}`);
                    }
                    anonsYapilanlar.add(durak.ad);
                }
            });
            db.ref('aracKonumu').set({ nerede: yakinDurak });
            document.getElementById('gpsBilgi').innerText = "Son Konum: " + new Date().toLocaleTimeString();
        }, null, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function listeyiSifirla() { if(confirm("Listeyi temizle?")) { db.ref().remove(); anonsYapilanlar.clear(); location.reload(); } }
</script>
</body>
</html>
